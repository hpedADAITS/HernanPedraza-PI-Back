services:
  - type: web
    name: syncrekuest-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://sr-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://sr-frontend.onrender.com
      - key: SOCKET_CORS_ORIGIN
        value: https://sr-frontend.onrender.com
